<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan</title>
</head>
<body>
    <header>
        <p id="current-date"></p>
        <h1>Godmorgon, Josef!</h1>
    </header>
    <main>
        <section id="today-workout">
            <div class="card-header-row">
                <span class="dagens">Dagens träningspass</span>
                <span class="kropps-del">Överkropp</span>
            </div>
        <h2>Press styrka</h2>
        <p>Bröst, axlar & triceps</p>
        <div class="timer-stats">
            <span>52 min</span>
            <span>415 kcal</span>
        </div>

        <button class="btn-start">Starta pass</button>
        </section>
        <section class="week-overview">
            <div class="card-header-row">
                <span class="this-week">Denna veckan</span>
                <h3>Statistik</h3>
            </div>
            <div class="week-days"></div>
                <ul>
                    <li>Mån</li>
                    <li>Tis</li>
                    <li>Ons</li>
                    <li>Tors</li>
                    <li>Fre</li>
                    <li>Lör</li>
                    <li>Sön</li>
                </ul>
        </section>
    </main>
    <aside>

    </aside>
    <footer>

    </footer>
</body>
</html>
